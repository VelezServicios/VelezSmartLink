<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vélez SmartLink - Innovación NFC</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a1f44 0%, #0077b6 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(10, 31, 68, 0.8);
        }
        .logo-img {
            max-width: 120px;
            height: auto;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 16px;
            font-weight: bold;
        }
        nav a:hover {
            color: #87ceeb;
        }
        main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 60px;
            flex-grow: 1;
            flex-wrap: wrap;
        }
        .text-section {
            max-width: 50%;
            flex: 1;
            min-width: 300px;
            order: 1;
        }
        h1 {
            font-size: 50px;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .lema {
            font-size: 24px;
            color: #87ceeb;
            margin-bottom: 30px;
            display: block;
        }
        .descripcion {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .image-section {
            max-width: 45%;
            flex: 1;
            min-width: 300px;
            text-align: right;
            order: 2;
        }
        .main-img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 15px;
            }
            .logo-img {
                margin-bottom: 15px;
            }
            nav {
                display: flex;
                flex-direction: row;
                justify-content: center;
                gap: 15px;
                width: 100%;
                flex-wrap: wrap;
            }
            nav a {
                margin: 0;
                font-size: 14px;
            }
            main {
                text-align: center;
                padding: 20px;
                flex-direction: column;
            }
            .text-section {
                max-width: 100%;
                margin-top: 10px;
                order: 1;
            }
            .image-section {
                max-width: 100%;
                margin-top: 30px;
                order: 2;
                text-align: center;
            }
            h1 {
                font-size: 35px;
            }
            .lema {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<header>
    <div>
        <img src="NoFondoLogoVelez.png" alt="Logo Vélez SmartLink" class="logo-img">
    </div>
    <nav>
        <a href="http://wa.me/5666140182" target="_blank">WhatsApp</a>
        <a href="https://www.facebook.com/share/1C3goSpDkD/" target="_blank">Facebook</a>
        <a href="https://www.instagram.com/_velez_smartlink_?stkn=MXZla3RmZ3RxNTC=" target="_blank">Instagram</a>
        <a href="Servicios.html">Servicios</a>
    </nav>
</header>

<main>
    <div class="text-section">
        <h1>Innovación NFC con conectividad total</h1>
        <span class="lema">Impulsando tu negocio hacia el futuro digital</span>
        <p class="descripcion">
            Tarjetas NFC para reseñas, exhibidores NFC y sitios web para negocios. 
            Conectamos a tus clientes con tu perfil digital al instante.
        </p>
    </div>
    <div class="image-section">
        <img src="PrincLogoWeb.jpg" alt="Imagen Principal de la Empresa" class="main-img">
    </div>
</main>

</body>
</html>
